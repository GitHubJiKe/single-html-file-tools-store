<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Bookmark Manager - 极简站点收藏</title>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header & Search */
        header {
            position: sticky;
            top: 20px;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
            min-height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            outline: none;
            transition: all 0.2s;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }

        /* Grid */
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .favicon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #f1f5f9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }

        .card-title:hover {
            color: var(--primary);
        }

        .card-url {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            background: #eef2ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 500;
        }

        .card-actions {
            margin-top: auto;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-actions {
            opacity: 1;
        }

        .action-icon {
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 16px;
        }

        .action-icon:hover {
            color: var(--text-main);
        }

        .action-icon.delete:hover {
            color: var(--danger);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #fff;
            width: 90%;
            max-width: 450px;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        .modal-footer {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 2000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 24px;
                opacity: 1;
            }
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--primary);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            z-index: 90;
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .fab {
                display: flex;
            }

            .header-add-btn {
                display: none;
            }
        }

        [data-lucide] {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>

    <div class="container" id="app">
        <header>
            <div class="logo">
                <i data-lucide="bookmark"></i>
                <span>LocalBook</span>
            </div>
            <div class="search-wrapper">
                <i data-lucide="search" style="position: absolute; left: 12px;"></i>
                <input type="text" id="searchInput" placeholder="搜索标题、URL 或标签..." autocomplete="off">
            </div>
            <button class="btn header-add-btn" onclick="openModal()">
                <i data-lucide="plus"></i>
                添加收藏
            </button>
            <button class="btn btn-outline" onclick="exportData()" title="导出数据">
                <i data-lucide="download"></i>
            </button>
            <button class="btn btn-outline" onclick="triggerImport()" title="导入数据">
                <i data-lucide="upload"></i>
            </button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
        </header>

        <div class="bookmark-grid" id="bookmarkGrid">
            <!-- Bookmark cards will appear here -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i data-lucide="inbox"></i>
            <p>暂无收藏，点击右上角开始添加吧</p>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">添加新收藏</h2>
                <i data-lucide="x" style="cursor: pointer;" onclick="closeModal()"></i>
            </div>
            <div class="form-group">
                <label>网站 URL</label>
                <input type="text" id="bmUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>网站标题</label>
                <input type="text" id="bmTitle" placeholder="在此输入标题">
            </div>
            <div class="form-group">
                <label>标签 (用逗号分隔)</label>
                <input type="text" id="bmTags" placeholder="工具, 资源, 灵感">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn" onclick="saveBookmark()">确认保存</button>
            </div>
        </div>
    </div>

    <div class="fab" onclick="openModal()">
        <i data-lucide="plus" style="width: 24px; height: 24px;"></i>
    </div>

    <div id="toast"></div>

    <script>
        let bookmarks = [];
        let editingId = null;

        // Initialize
        function init() {
            const stored = localStorage.getItem('local_bookmarks');
            if (stored) {
                bookmarks = JSON.parse(stored);
            }
            render();
            lucide.createIcons();
        }

        // Save UI
        function render(filter = '') {
            const grid = document.getElementById('bookmarkGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';

            const filtered = bookmarks.filter(b =>
                b.title.toLowerCase().includes(filter.toLowerCase()) ||
                b.url.toLowerCase().includes(filter.toLowerCase()) ||
                (b.tags && b.tags.some(t => t.toLowerCase().includes(filter.toLowerCase())))
            );

            if (filtered.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                filtered.sort((a, b) => b.createdAt - a.createdAt).forEach(bm => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                    <div class="card-header">
                        <div class="favicon">
                            <img src="https://www.google.com/s2/favicons?domain=${new URL(bm.url).hostname}&sz=32" 
                                 onerror="this.src='https://lucide.dev/api/icon/globe?size=32&stroke=64748b'" 
                                 width="20" height="20">
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <a href="${bm.url}" target="_blank" class="card-title">${bm.title}</a>
                            <span class="card-url">${bm.url}</span>
                        </div>
                    </div>
                    <div class="tag-row">
                        ${bm.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div class="card-actions">
                        <i data-lucide="copy" class="action-icon" onclick="copyUrl('${bm.url}')" title="复制链接"></i>
                        <i data-lucide="edit-3" class="action-icon" onclick="editBookmark('${bm.id}')" title="编辑"></i>
                        <i data-lucide="trash-2" class="action-icon delete" onclick="deleteBookmark('${bm.id}')" title="删除"></i>
                    </div>
                `;
                    grid.appendChild(card);
                });
                lucide.createIcons();
            }
        }

        // Modal logic
        function openModal() {
            editingId = null;
            document.getElementById('modalTitle').innerText = '添加新收藏';
            document.getElementById('bmUrl').value = '';
            document.getElementById('bmTitle').value = '';
            document.getElementById('bmTags').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function saveBookmark() {
            const url = document.getElementById('bmUrl').value.trim();
            const title = document.getElementById('bmTitle').value.trim();
            const tagsInput = document.getElementById('bmTags').value.trim();

            if (!url || !title) {
                showToast('请完整填写标题和 URL');
                return;
            }

            try { new URL(url); } catch (e) { showToast('请输入有效的 URL'); return; }

            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

            if (editingId) {
                const idx = bookmarks.findIndex(b => b.id === editingId);
                bookmarks[idx] = { ...bookmarks[idx], url, title, tags, updatedAt: Date.now() };
                showToast('修改成功');
            } else {
                bookmarks.push({
                    id: Date.now().toString(),
                    url,
                    title,
                    tags,
                    createdAt: Date.now()
                });
                showToast('添加成功');
            }

            localStorage.setItem('local_bookmarks', JSON.stringify(bookmarks));
            closeModal();
            render();
        }

        function deleteBookmark(id) {
            if (confirm('确认删除该收藏吗？')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                localStorage.setItem('local_bookmarks', JSON.stringify(bookmarks));
                render();
                showToast('已删除');
            }
        }

        function editBookmark(id) {
            const bm = bookmarks.find(b => b.id === id);
            if (bm) {
                editingId = id;
                document.getElementById('modalTitle').innerText = '编辑收藏';
                document.getElementById('bmUrl').value = bm.url;
                document.getElementById('bmTitle').value = bm.title;
                document.getElementById('bmTags').value = bm.tags.join(', ');
                document.getElementById('modalOverlay').style.display = 'flex';
            }
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            render(e.target.value);
        });

        // Toast
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => showToast('链接已复制到剪贴板'));
        }

        // Persistence
        function exportData() {
            const blob = new Blob([JSON.stringify(bookmarks, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookmarks_bak_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        bookmarks = [...bookmarks, ...data];
                        // Duplication check by URL
                        const seen = new Set();
                        bookmarks = bookmarks.filter(el => {
                            const duplicate = seen.has(el.url);
                            seen.add(el.url);
                            return !duplicate;
                        });
                        localStorage.setItem('local_bookmarks', JSON.stringify(bookmarks));
                        render();
                        showToast('数据导入成功');
                    }
                } catch (err) {
                    showToast('解析失败，请检查文件格式');
                }
            };
            reader.readAsText(file);
        }

        window.onload = init;
    </script>

</body>

</html>
