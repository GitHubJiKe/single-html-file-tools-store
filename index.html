<!-- 工具站点落地页（单文件HTML实现，无需构建步骤）-->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线工具集 - 简单实用的Web工具</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      color: white;
      padding: 40px 20px;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      font-size: 18px;
      opacity: 0.95;
      font-weight: 300;
    }
    .search-section {
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      outline: none;
      transition: box-shadow 0.3s ease;
    }
    .search-input:focus {
      box-shadow: 0 6px 30px rgba(0,0,0,0.25);
    }
    .search-input::placeholder {
      color: #a0aec0;
    }
    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #a0aec0;
      pointer-events: none;
    }
    .search-stats {
      text-align: center;
      color: white;
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .tool-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .tool-card.hidden {
      display: none;
    }
    .tool-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-shrink: 0;
    }
    .tool-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a202c;
      line-height: 1.3;
    }
    .tool-desc {
      font-size: 14px;
      color: #4a5568;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background: #edf2f7;
      color: #4a5568;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
    }
    footer {
      text-align: center;
      color: white;
      padding: 30px 20px;
      opacity: 0.9;
    }
    footer a {
      color: white;
      text-decoration: underline;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      text-align: center;
    }
    .stat-number {
      font-size: 32px;
      font-weight: 700;
      display: block;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .no-results {
      text-align: center;
      color: white;
      padding: 60px 20px;
      font-size: 18px;
    }
    .no-results-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      .subtitle { font-size: 16px; }
      .search-input { font-size: 15px; padding: 12px 44px 12px 16px; }
      .search-icon { right: 16px; font-size: 18px; }
      .tools-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .tool-card { padding: 16px; }
      .tool-icon { width: 40px; height: 40px; font-size: 22px; }
      .tool-title { font-size: 16px; }
      .tool-desc { font-size: 13px; }
      .stats { gap: 24px; }
      .stat-number { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛠️ 在线工具集</h1>
      <p class="subtitle">简单、快速、无需安装的实用Web工具</p>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="tool-count">13</span>
          <span class="stat-label">个工具</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">100%</span>
          <span class="stat-label">免费开源</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">0</span>
          <span class="stat-label">依赖安装</span>
        </div>
      </div>
    </header>

    <main>
      <div class="search-section">
        <div class="search-box">
          <input 
            type="text" 
            class="search-input" 
            id="search-input" 
            placeholder="搜索工具... (支持名称、标签、描述)"
            autocomplete="off"
          >
          <span class="search-icon">🔍</span>
        </div>
        <div class="search-stats" id="search-stats"></div>
      </div>

      <div class="tools-grid" id="tools-container">
        <!-- 工具卡片将通过 JavaScript 动态生成 -->
      </div>
      
      <div class="no-results" id="no-results" style="display: none;">
        <div class="no-results-icon">🔍</div>
        <div>未找到匹配的工具</div>
        <div style="margin-top: 10px; font-size: 14px; opacity: 0.8;">试试其他关键词</div>
      </div>
    </main>

    <footer>
      <p>所有工具均基于单文件HTML实现，无需构建步骤，可直接使用</p>
      <p style="margin-top: 10px; font-size: 14px;">遵循 <a href="https://simonwillison.net/2025/Dec/10/html-tools/" target="_blank">Simon Willison 单文件哲学</a></p>
    </footer>
  </div>

  <script>
    // 工具数据配置

      },

        icon: '📱',

        icon: '🔗',

      },

        icon: '🔐',

        tags: ['Base64', '编码', '开发工具']
      },
      {
        id: 'canvas-gif-maker',
        title: 'Canvas 画图与 GIF 制作',
        description: '在线 Canvas 画板工具，支持自由绘画、颜色调整、九宫格图片管理，可将多张图片合成 GIF 动图并下载',
        icon: '🎨',

      },
      {

        icon: '📄',

      },
      {
        id: 'form-builder',
        title: '表单构建器',
        description: '灵活配置化表单管理系统。支持10种控件类型，拖拽式设计，发布表单收集数据，支持数据分析和导出。采用Local-First原则，所有数据本地存储，完全离线可用。',
        icon: '📋',

      }
    ];

    // 渲染工具卡片
    function renderTools(filteredTools = tools) {
      const container = document.getElementById('tools-container');
      const toolCount = document.getElementById('tool-count');
      const noResults = document.getElementById('no-results');
      const searchStats = document.getElementById('search-stats');
      
      // 清空容器
      container.innerHTML = '';
      
      // 更新总数
      toolCount.textContent = tools.length;
      
      // 显示搜索结果统计
      const searchInput = document.getElementById('search-input');
      if (searchInput && searchInput.value.trim()) {
        searchStats.textContent = `找到 ${filteredTools.length} 个工具`;
        searchStats.style.display = 'block';
      } else {
        searchStats.style.display = 'none';
      }
      
      // 显示/隐藏无结果提示
      if (filteredTools.length === 0) {
        noResults.style.display = 'block';
        container.style.display = 'none';
      } else {
        noResults.style.display = 'none';
        container.style.display = 'grid';
      }
      
      // 渲染工具卡片
      filteredTools.forEach(tool => {
        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = tool.url;
        card.dataset.toolId = tool.id;
        
        card.innerHTML = `
          <div class="tool-header">
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-title">${tool.title}</div>
          </div>
          <div class="tool-desc">${tool.description}</div>
          <div class="tool-tags">
            ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // 搜索功能
    function searchTools(query) {
      if (!query.trim()) {
        renderTools(tools);
        return;
      }
      
      const lowerQuery = query.toLowerCase();
      const filtered = tools.filter(tool => {
        // 搜索标题
        if (tool.title.toLowerCase().includes(lowerQuery)) return true;
        // 搜索描述
        if (tool.description.toLowerCase().includes(lowerQuery)) return true;
        // 搜索标签
        if (tool.tags.some(tag => tag.toLowerCase().includes(lowerQuery))) return true;
        // 搜索 ID
        if (tool.id.toLowerCase().includes(lowerQuery)) return true;
        return false;
      });
      
      renderTools(filtered);
    }

    // 页面加载时渲染工具
    window.addEventListener('DOMContentLoaded', () => {
      renderTools();
      
      // 绑定搜索事件
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchTools(e.target.value);
      });
      
      // 支持 URL 参数搜索
      const params = new URLSearchParams(location.search);
      const searchQuery = params.get('search');
      if (searchQuery) {
        searchInput.value = searchQuery;
        searchTools(searchQuery);
      }
    });

    // 添加简单的点击统计（使用 localStorage）
    document.addEventListener('click', function(e) {
      const card = e.target.closest('.tool-card');
      if (card) {
        const toolId = tools.find(t => card.href.includes(t.url))?.id;
        if (toolId) {
          const stats = JSON.parse(localStorage.getItem('tool-stats') || '{}');
          stats[toolId] = (stats[toolId] || 0) + 1;
          localStorage.setItem('tool-stats', JSON.stringify(stats));
        }
      }
    });
  </script>

  <!--
    工具元信息：
    核心提示词：基于Simon Willison单文件哲学开发HTML工具站点落地页，要求：1. 单个HTML文件，内嵌JS/CSS，无构建步骤，No React；2. 核心功能：展示工具列表，提供导航链接，美观的UI设计；3. 依赖：无依赖，仅原生API；4. 交互：卡片式布局，悬停效果，响应式设计；5. 状态存储：使用localStorage记录点击统计。
    依赖CDN：无
    最后修改：2025-12-22
  -->
</body>
</html>
