    .theme-selector select {

      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      background: white;

    .btn {

      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;

    .btn-primary {
      background: #07c160;
      color: white;
    }

    .btn-primary:hover {

    .btn-secondary {

    .btn-secondary:hover {

    .main-content {

      flex: 1;

      flex: 1;

      flex-direction: column;
      overflow: hidden;

    .editor-panel {
      background: #1e1e1e;
      border-right: 1px solid #ddd;

    .preview-panel {

    .panel-header {

      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid #ddd;
    }

    .editor-panel .panel-header {
      background: #2d2d2d;
      color: #ccc;
      border-bottom: 1px solid #1e1e1e;
    }

    .preview-panel .panel-header {
      background: #fafafa;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 预览区 */

      overflow-y: auto;

  <div class="container">
    <!-- 头部工具栏 -->
    <div class="header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <i data-lucide="file-text" style="color: #07c160;"></i>
        <h1>Markdown 转公众号格式</h1>
      </div>
      <div class="toolbar">
        <div class="theme-selector">
          <label><i data-lucide="palette"
              style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i> 主题：</label>
          <select id="themeSelect">
            <option value="default">微信绿 (默认)</option>
            <option value="orange">橙心 (温暖)</option>
            <option value="blue">蓝调 (专业)</option>
            <option value="purple">紫罗兰 (优雅)</option>
            <option value="minimal">极简黑 (商务)</option>
            <option value="deepnight">深夜模式 (沉浸)</option>
            <option value="nordic">北欧 (清爽)</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="localizeImages()">
          <i data-lucide="download-cloud"
            style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i> 图片本地化
        </button>
        <button class="btn btn-secondary" onclick="clearContent()">清空</button>
        <button class="btn btn-primary" onclick="copyToClipboard()">
          <i data-lucide="copy" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i>
          复制到公众号
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 编辑器面板 -->

      <div class="preview-panel">
        <div class="panel-header">
          <span>预览效果</span>
          <span style="font-size: 12px; color: #999;">（复制后可直接粘贴到公众号编辑器）</span>
        </div>
        <div id="preview">
          <div class="wechat-content theme-default" id="content"></div>

  <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script>
    // 初始化 Lucide 图标
    lucide.createIcons();

    // 初始化 Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });

    // 配置 Marked.js，支持 Mermaid
    marked.use({
      renderer: {
        code({ text, lang }) {
          if (lang === 'mermaid') {
            return `<div class="mermaid">${text}</div>`;
          }
          // 返回 false 表示使用默认渲染逻辑
          return false;
        }
      }
    });

    marked.setOptions({
      breaks: true,
      gfm: true
    });

    // 元素获取
    const editor = document.getElementById('editor');
    const preview = document.getElementById('content');
    const themeSelect = document.getElementById('themeSelect');
    const toast = document.getElementById('toast');

    // 实时预览逻辑
    let renderTimer = null;
    editor.addEventListener('input', () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(updatePreview, 300);
    });

    themeSelect.addEventListener('change', updateTheme);

    async function updatePreview() {
      const markdown = editor.value;
      const html = marked.parse(markdown);
      preview.innerHTML = html;

      // 渲染 Mermaid 图表
      try {
        await mermaid.run({
          nodes: document.querySelectorAll('.mermaid'),
        });
      } catch (err) {
        console.error('Mermaid 渲染失败:', err);
      }

      // 重新加载图标（如果预览中有图标需求）
      lucide.createIcons();
    }

    function updateTheme() {
      const theme = themeSelect.value;
      const previewContainer = document.getElementById('preview').firstElementChild;
      previewContainer.className = `wechat-content theme-${theme}`;
      updatePreview();
    }

    // 图片本地化
    async function localizeImages() {
      const images = Array.from(preview.querySelectorAll('img'));
      if (images.length === 0) {
        showToast('未找到需要处理的图片', 'info');
        return;
      }

      showToast('正在转换图片，请稍候...', 'info');
      let count = 0;
      let mdValue = editor.value;

      for (const img of images) {
        const src = img.src;
        if (src.startsWith('data:')) continue;

        try {
          const response = await fetch(src);
          const blob = await response.blob();
          const base64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(blob);
          });

          // 在内容中替换（简单字符串替换可能会有风险，但单文件工具中通常有效）
          mdValue = mdValue.replace(src, base64);
          count++;
        } catch (err) {
          console.warn(`图片 ${src} 转换失败:`, err);
        }
      }

      if (count > 0) {
        editor.value = mdValue;
        updatePreview();
        showToast(`✅ 已成功本地化 ${count} 张图片`);
      } else {
        showToast('⚠️ 转换失败，可能是存在跨域限制', 'error');
      }
    }

    function clearContent() {
      if (confirm('确定要清空所有内容吗？')) {
        editor.value = '';
        preview.innerHTML = '';
      }
    }

    function copyToClipboard() {
      const themeClass = preview.className;
      const tempDiv = document.createElement('div');
      tempDiv.contentEditable = true;
      tempDiv.style.position = 'absolute';
      tempDiv.style.left = '-9999px';
      tempDiv.style.background = '#ffffff';
      tempDiv.className = themeClass;

      // 为 Mermaid SVG 添加特定处理，确保复制后样式不丢失
      const clonedContent = preview.cloneNode(true);
      clonedContent.querySelectorAll('svg').forEach(svg => {
        svg.style.maxWidth = '100%';
        svg.setAttribute('width', svg.getBoundingClientRect().width);
      });

      tempDiv.innerHTML = clonedContent.innerHTML;
      document.body.appendChild(tempDiv);

      const range = document.createRange();
      range.selectNodeContents(tempDiv);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      try {
        document.execCommand('copy');
        showToast('✅ 复制成功！现在可以粘贴到公众号了');
      } catch (err) {
        showToast('❌ 复制失败，请手动选择复制', 'error');
      }

      document.body.removeChild(tempDiv);
      selection.removeAllRanges();
    }

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.style.background = (type === 'error') ? '#e74c3c' : (type === 'info' ? '#3498db' : '#07c160');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 初始化预览
    updatePreview();

    // 快捷键支持
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        copyToClipboard();
      }
    });
  </script>
