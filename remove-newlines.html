<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>去除换行工具 · Remove Newlines</title>
  <meta name="description" content="一键清除文本中的所有换行符，快速复制粘贴使用。" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --border: #e2e5ed;
      --border-focus: #6c63ff;
      --text: #1a1d27;
      --text-muted: #8990a4;
      --accent: #6c63ff;
      --accent-hover: #5548e0;
      --accent-light: #f0eeff;
      --success: #22c55e;
      --success-hover: #16a34a;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--accent-light);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 1px; }

    /* ── Options Bar ── */
    .options-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .option-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .toggle-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toggle-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .toggle-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 24px 28px;
      min-height: 0;
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-left { padding-right: 14px; }
    .panel-right { padding-left: 14px; border-left: 1px solid var(--border); }
    @media (max-width: 700px) {
      .panel-left { padding-right: 0; }
      .panel-right { padding-left: 0; border-left: none; border-top: 1px solid var(--border); padding-top: 16px; }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .char-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 20px;
    }

    textarea, .output-box {
      flex: 1;
      min-height: 320px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      font-family: inherit;
      background: var(--surface);
      resize: none;
      color: var(--text);
      transition: border-color .2s;
      word-break: break-all;
      overflow-y: auto;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent-focus, var(--accent));
      box-shadow: 0 0 0 3px rgba(108,99,255,.1);
    }
    .output-box {
      white-space: pre-wrap;
      cursor: text;
      user-select: text;
    }
    .output-box.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      white-space: normal;
      cursor: default;
      flex-direction: column;
      gap: 8px;
    }
    .output-box.empty .empty-icon { font-size: 32px; opacity: .3; }

    /* ── Action Row ── */
    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-success:hover { background: var(--success-hover); }
    .btn-ghost {
      background: var(--bg);
      color: var(--text-muted);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .copy-feedback {
      font-size: 13px;
      color: var(--success);
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .copy-feedback.show { display: flex; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1d27;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 9999;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Diff highlight ── */
    .diff-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <div class="header-icon">✂️</div>
  <div>
    <div class="header-title">去除换行工具</div>
    <div class="header-sub">清除文本中的所有换行符，一键复制使用</div>
  </div>
</header>

<div class="options-bar">
  <span class="option-label">处理模式</span>
  <div class="toggle-group" id="modeGroup">
    <button class="toggle-btn active" data-mode="remove" title="将所有换行符直接删除">删除换行</button>
    <button class="toggle-btn" data-mode="space" title="将换行符替换为一个空格">换行→空格</button>
    <button class="toggle-btn" data-mode="trim" title="删除换行并合并多余空格">删换行+合并空格</button>
  </div>
</div>

<main>
  <!-- Left: Input -->
  <div class="panel panel-left">
    <div class="panel-header">
      <span class="panel-title">输入</span>
      <span class="char-count" id="inputCount">0 字符</span>
    </div>
    <textarea
      id="inputArea"
      placeholder="在此粘贴或输入包含换行的文本…&#10;&#10;支持拖拽文本文件到此区域"
      spellcheck="false"
    ></textarea>
    <div class="action-row">
      <button class="btn btn-ghost" id="clearBtn">🗑 清空</button>
    </div>
  </div>

  <!-- Right: Output -->
  <div class="panel panel-right">
    <div class="panel-header">
      <span class="panel-title">结果</span>
      <span id="removedBadge" class="diff-badge" style="display:none"></span>
      <span class="char-count" id="outputCount">0 字符</span>
    </div>
    <div class="output-box empty" id="outputBox">
      <span class="empty-icon">📋</span>
      <span>输入内容后自动处理</span>
    </div>
    <div class="action-row">
      <button class="btn btn-success" id="copyBtn">📋 一键复制</button>
      <span class="copy-feedback" id="copyFeedback">✅ 已复制到剪贴板</span>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  const inputArea   = document.getElementById('inputArea');
  const outputBox   = document.getElementById('outputBox');
  const inputCount  = document.getElementById('inputCount');
  const outputCount = document.getElementById('outputCount');
  const copyBtn     = document.getElementById('copyBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const copyFeedback= document.getElementById('copyFeedback');
  const modeGroup   = document.getElementById('modeGroup');
  const removedBadge= document.getElementById('removedBadge');
  const toast       = document.getElementById('toast');

  let currentMode = 'remove';
  let toastTimer  = null;
  let feedbackTimer = null;

  // ── Mode toggle ──
  modeGroup.addEventListener('click', e => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    modeGroup.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    processInput();
  });

  // ── Core processing ──
  function processText(text, mode) {
    switch (mode) {
      case 'remove':
        return text.replace(/[\r\n]+/g, '');
      case 'space':
        return text.replace(/[\r\n]+/g, ' ');
      case 'trim':
        return text.replace(/[\r\n]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      default:
        return text;
    }
  }

  function processInput() {
    const raw = inputArea.value;
    inputCount.textContent = `${raw.length} 字符`;

    if (!raw) {
      outputBox.textContent = '';
      outputBox.className = 'output-box empty';
      outputBox.innerHTML = '<span class="empty-icon">📋</span><span>输入内容后自动处理</span>';
      outputCount.textContent = '0 字符';
      removedBadge.style.display = 'none';
      return;
    }

    const result = processText(raw, currentMode);

    // Count removed newlines
    const newlineCount = (raw.match(/[\r\n]/g) || []).length;

    outputBox.className = 'output-box';
    outputBox.textContent = result;
    outputCount.textContent = `${result.length} 字符`;

    if (newlineCount > 0) {
      removedBadge.textContent = `已清除 ${newlineCount} 个换行`;
      removedBadge.style.display = 'inline-block';
    } else {
      removedBadge.style.display = 'none';
    }
  }

  inputArea.addEventListener('input', processInput);

  // ── Copy ──
  copyBtn.addEventListener('click', () => {
    const text = outputBox.textContent;
    if (!text || outputBox.classList.contains('empty')) {
      showToast('⚠️ 没有可复制的内容');
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => onCopied()).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      onCopied();
    } catch {
      showToast('❌ 复制失败，请手动选择文本');
    } finally {
      document.body.removeChild(ta);
    }
  }

  function onCopied() {
    showToast('✅ 已复制到剪贴板');
    copyFeedback.classList.add('show');
    if (feedbackTimer) clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => copyFeedback.classList.remove('show'), 2500);
  }

  // ── Clear ──
  clearBtn.addEventListener('click', () => {
    inputArea.value = '';
    processInput();
    inputArea.focus();
  });

  // ── Toast ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── Drag & Drop file ──
  inputArea.addEventListener('dragover', e => { e.preventDefault(); inputArea.style.borderColor = 'var(--accent)'; });
  inputArea.addEventListener('dragleave', () => { inputArea.style.borderColor = ''; });
  inputArea.addEventListener('drop', e => {
    e.preventDefault();
    inputArea.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('text')) {
      const reader = new FileReader();
      reader.onload = ev => { inputArea.value = ev.target.result; processInput(); };
      reader.readAsText(file, 'UTF-8');
    } else if (e.dataTransfer.getData('text')) {
      inputArea.value = e.dataTransfer.getData('text');
      processInput();
    }
  });

  // ── URL state persistence (Deep Linking) ──
  function saveState() {
    try {
      const v = inputArea.value;
      if (v.length < 2000) {
        const url = new URL(location.href);
        url.searchParams.set('t', encodeURIComponent(v));
        url.searchParams.set('m', currentMode);
        history.replaceState(null, '', url.toString());
      }
    } catch {}
  }

  function restoreState() {
    try {
      const params = new URLSearchParams(location.search);
      const t = params.get('t');
      const m = params.get('m');
      if (t) {
        inputArea.value = decodeURIComponent(t);
      }
      if (m) {
        const btn = modeGroup.querySelector(`[data-mode="${m}"]`);
        if (btn) {
          modeGroup.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = m;
        }
      }
      if (t) processInput();
    } catch {}
  }

  inputArea.addEventListener('input', saveState);
  modeGroup.addEventListener('click', saveState);

  // Init
  restoreState();
</script>

<!--
  Tool: 去除换行工具 (Remove Newlines)
  Version: 1.0.0
  Created: 2026-04-14
  Philosophy: Simon Willison single-file tool
  Dependencies: None (pure vanilla HTML/CSS/JS)
  Features:
    - 3 processing modes: remove / replace with space / trim & merge
    - Real-time processing as you type
    - One-click copy to clipboard (with fallback)
    - Drag & drop .txt file support
    - URL state persistence (Deep Linking, max 2KB)
    - Removed newline count badge
-->
</body>
</html>
